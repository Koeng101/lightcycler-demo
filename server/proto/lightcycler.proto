syntax = "proto3";

package lightcycler.v1;

// LightCyclerService controls a Roche LightCycler 480 II qPCR instrument.
//
// The experiment data model follows pylabrobot's Protocol/Stage/Step pattern:
//   Protocol (RunExperimentRequest) → Stages → Steps
//
// Each Step defines a temperature + hold time. Steps with acquire=true
// trigger a fluorescence plate read at that temperature.
service LightCyclerService {
  // Machine state and logs
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);

  // Experiments (fire-and-forget: RunExperiment returns immediately)
  rpc RunExperiment(RunExperimentRequest) returns (RunExperimentResponse);
  rpc GetExperiment(GetExperimentRequest) returns (GetExperimentResponse);
  rpc ListExperiments(ListExperimentsRequest) returns (ListExperimentsResponse);

  // Door control (SwitchBot Fingerbot — press mode)
  rpc PressDoor(PressDoorRequest) returns (PressDoorResponse);
  rpc GetDoorStatus(GetDoorStatusRequest) returns (GetDoorStatusResponse);
}

// --- Machine state ---

message GetStateRequest {}

message GetStateResponse {
  int32 instrument_state = 1;   // 6=post-init, 7=running, 10=idle
  string firmware_version = 2;
  string controller_count = 3;
  bool connected = 4;
  string current_experiment_guid = 5;  // empty if none running
}

// --- Logs ---

message GetLogsRequest {
  int32 limit = 1;  // max entries to return (default 100)
  int32 since_id = 2;  // return entries with id > since_id
}

message LogEntry {
  int64 id = 1;
  string timestamp = 2;
  int32 event_code = 3;
  string sub_code = 4;
  string message = 5;
}

message GetLogsResponse {
  repeated LogEntry entries = 1;
}

// --- Experiments ---

enum FilterSet {
  FILTER_UNSPECIFIED = 0;
  SYBR_GREEN = 1;  // FAM / SYBR Green I (465/510 nm)
  HEX = 2;         // HEX / VIC (533/580 nm)
  ROX = 3;         // ROX (533/610 nm)
  CY5 = 4;         // Cy5 (618/660 nm)
}

enum ExperimentStatus {
  STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  RUNNING = 2;
  COMPLETE = 3;
  ERROR = 4;
}

// A single thermal step: hold at a temperature, optionally read fluorescence.
// Mirrors pylabrobot's thermocycling.standard.Step.
message Step {
  double temperature_c = 1;    // target temperature in Celsius
  double hold_seconds = 2;     // hold time at temperature
  bool acquire = 3;            // if true, take a fluorescence plate read
  FilterSet filter = 4;        // filter set (only used when acquire=true)
  int32 exposure = 5;          // exposure value in firmware units (default 4800)
}

// A group of steps repeated N times (one thermal cycle).
// Mirrors pylabrobot's thermocycling.standard.Stage.
message Stage {
  repeated Step steps = 1;
  int32 repeats = 2;           // number of times to repeat this stage (default 1)
}

// Run an experiment defined as a list of stages.
//
// Example: 3 fluorescence reads at 37°C with 1s hold
//   stages: [{ steps: [{ temperature_c: 37, hold_seconds: 1, acquire: true }], repeats: 3 }]
//
// Example: 30-cycle qPCR with SYBR Green read during annealing
//   stages: [
//     { steps: [{ temperature_c: 95, hold_seconds: 120 }], repeats: 1 },
//     { steps: [
//         { temperature_c: 95, hold_seconds: 30 },
//         { temperature_c: 55, hold_seconds: 30, acquire: true, filter: SYBR_GREEN },
//         { temperature_c: 72, hold_seconds: 60 },
//       ], repeats: 30 },
//     { steps: [{ temperature_c: 72, hold_seconds: 300 }], repeats: 1 },
//   ]
message RunExperimentRequest {
  repeated Stage stages = 1;
  int32 well_count = 2;        // 96 or 384 (default 384)
  int32 volume_ul = 3;         // reaction volume in uL (default 20)
}

message RunExperimentResponse {
  string guid = 1;  // experiment GUID, use with GetExperiment to poll
}

message GetExperimentRequest {
  string guid = 1;
}

message Acquisition {
  int32 acquisition_num = 1;
  int32 stage_index = 2;       // which stage this read came from (0-indexed)
  int32 step_index = 3;        // which step within the stage (0-indexed)
  int32 cycle = 4;             // which cycle of the stage (1-indexed)
  double temperature_c = 5;
  double time_s = 6;
  int32 ref_channel = 7;
  repeated int32 well_values = 8;  // fluorescence per well
}

message GetExperimentResponse {
  string guid = 1;
  ExperimentStatus status = 2;
  repeated Stage stages = 3;   // the protocol that was run
  int32 well_count = 4;
  int32 volume_ul = 5;
  string created_at = 6;
  string completed_at = 7;
  string error_message = 8;
  repeated Acquisition acquisitions = 9;
}

message ListExperimentsRequest {
  int32 limit = 1;  // default 50
}

message ListExperimentsResponse {
  message ExperimentSummary {
    string guid = 1;
    ExperimentStatus status = 2;
    string created_at = 3;
    int32 num_acquisitions = 4;
  }
  repeated ExperimentSummary experiments = 1;
}

// --- Door control ---

message PressDoorRequest {}
message PressDoorResponse {
  bool success = 1;
  string error = 2;
}

message GetDoorStatusRequest {}
message GetDoorStatusResponse {
  int32 battery_percent = 1;
  bool available = 2;  // BLE reachable
  string error = 3;
}
